apiVersion: apps/v1
kind: Deployment
metadata:
  name: minilinks-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: minilinks-api
  template:
    metadata:
      labels:
        app: minilinks-api
    spec:
      containers:
        - name: api
          image: therealayinla/minilink-api:97d0d2c855b551424025af799c52ac4138075a2e
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: minilinks-env
