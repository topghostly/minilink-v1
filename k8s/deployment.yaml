apiVersion: apps/v1
kind: Deployment
metadata:
  name: minilinks-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: minilinks-api
  template:
    metadata:
      labels:
        app: minilinks-api
    spec:
      containers:
        - name: api
          image: therealayinla/minilink-api:750dda3296969f672e712c4140f37511fcb41a69
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: minilinks-env
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
