apiVersion: apps/v1
kind: Deployment
metadata:
  name: minilinks-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: minilinks-api
  template:
    metadata:
      labels:
        app: minilinks-api
    spec:
      containers:
        - name: api
          image: therealayinla/minilink-api:c84d6e4deec39d1504cd7a694eebfe390158ba2c
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: minilinks-env
